spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13316/course_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:course_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  flyway:
    enabled: true
server:
  port: ${PORT:18080}
  error:
    include-message: never
