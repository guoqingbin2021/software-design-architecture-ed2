server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: chapter9-enrollment
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13328/enrollment_ch9?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:ch9}
    password: ${DB_PASSWORD:Chapter9Db!Demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    log-resolved-exception: true
